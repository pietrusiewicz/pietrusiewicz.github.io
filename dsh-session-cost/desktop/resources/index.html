<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>dsh-session-cost installer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <div class="mark">$</div>
        <div>
          <h1>dsh-session-cost</h1>
          <p class="sub" data-t="subtitle">Install the token-cost badge in your DSH sidebar.</p>
        </div>
      </div>
      <div class="top-right">
        <span id="platform" class="chip">Linux</span>
        <button id="lang" class="ghost small" type="button">PL</button>
      </div>
    </header>

    <main>
      <section class="card">
        <div class="field">
          <label data-t="home">DSH home</label>
          <div class="path-row">
            <code id="homePath">~/.dsh</code>
            <button id="changeHome" class="ghost" type="button" data-t="change">Change</button>
          </div>
        </div>

        <div class="field">
          <label for="profile" data-t="profile">Profile</label>
          <div class="profile-row">
            <input id="profile" type="text" value="web" placeholder="web" autocomplete="off" spellcheck="false">
            <span id="profileState" class="state"></span>
          </div>
          <p class="hint" data-t="profileHint">Usually web. Start DSH once with this profile first.</p>
        </div>

        <div class="actions">
          <button id="install" class="primary" type="button" data-t="install">Install plugin</button>
          <button id="uninstall" class="ghost" type="button" data-t="uninstall">Uninstall</button>
        </div>
        <p class="hint" data-t="installHint">Copies the plugin to plugins/dsh-session-cost and updates cordis.patch.yml. A backup is kept.</p>
      </section>

      <section class="card log-card">
        <div class="log-head">
          <span data-t="log">Activity</span>
          <span id="status" class="pill">Ready</span>
        </div>
        <pre id="log" class="log">Ready.</pre>
      </section>
    </main>

    <footer>
      <button id="github" class="link" type="button" data-t="openGithub">GitHub</button>
      <span>v0.1.0</span>
    </footer>
  </div>
  <script src="js/neutralino.js"></script>
  <script src="js/core.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
